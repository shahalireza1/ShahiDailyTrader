symbols:
  - SPY
  - QQQ
start: "2018-01-01"
end: "2024-01-01"
mode: backtest
fees_bps: 1.0
slippage_bps: 1.0
starting_cash: 150000
strategies:
  - name: sma_cross
    parameters:
      fast: 20
      slow: 80
  - name: momentum
    parameters:
      lookback: 90
      threshold: 0.0
